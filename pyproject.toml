[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evdc-network-api"
dynamic = ["version"]
description = "Unofficial Python client for the EVDC EV charging network API"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "markoceri" },
]
keywords = ["evdc", "ev", "charging", "hubject", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.32.4",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
live = [
    "python-socketio[client]>=5.11",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "types-requests>=2.31",
    "python-socketio[client]>=5.11",
]

[project.urls]
Homepage = "https://github.com/markoceri/evdc-network-api"
Issues = "https://github.com/markoceri/evdc-network-api/issues"

[tool.hatch.version]
path = "src/evdc_network_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/evdc_network_api"]

[tool.hatch.build.targets.editable]
packages = ["src/evdc_network_api"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["socketio", "socketio.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S324", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
